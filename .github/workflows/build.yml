name: Build NovaGuard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --no-daemon

      - name: Smoke test on a real Paper 26.3 server
        run: scripts/smoke-test.sh 26.3 build/libs/NovaGuard.jar

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGuard
          path: build/libs/NovaGuard.jar

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novaguard-build-${{ github.run_number }}
          name: NovaGuard build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/libs/NovaGuard.jar
          body: |
            NovaGuard for Paper 26.3, built from commit ${{ github.sha }}.
            Download `NovaGuard.jar`, put it in your server's `plugins` folder, restart the server.
