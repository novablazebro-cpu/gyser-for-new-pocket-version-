name: Build NovaGuard

on:
  push:
    branches: ['**']
    tags: ['novaguard-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build --no-daemon

      - name: Smoke test on a real Paper 26.3 server
        run: scripts/smoke-test.sh 26.3 build/libs/NovaGuard.jar

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGuard
          path: build/libs/NovaGuard.jar

      # Version tags (novaguard-v1.2.3) and main publish a full release that becomes the "latest" download.
      # Other branch pushes publish a pre-release: downloadable for testing, but never marked "latest".
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('novaguard-build-{0}', github.run_number) }}
          name: NovaGuard ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ !(startsWith(github.ref, 'refs/tags/novaguard-v') || github.ref == 'refs/heads/main') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/novaguard-v') || github.ref == 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
          files: build/libs/NovaGuard.jar
          body: |
            NovaGuard for Paper 26.3, built from commit ${{ github.sha }}.
            Download `NovaGuard.jar`, put it in your server's `plugins` folder, restart the server.
