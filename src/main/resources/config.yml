# NovaGuard configuration. Use /novaguard reload after editing.
# VL = violation level. Every failed check adds VL; VL goes down by itself over time.

alerts:
  # Minimum milliseconds between two alerts for the same player and check (stops chat spam).
  cooldown-ms: 1500
  # Also print alerts in the server console.
  console: true

# Write every flag to plugins/NovaGuard/violations.log
log-to-file: true
# Also write what the player was doing (last moves, ping, effects, block below) when a check flags.
# This is how false positives are found: send these lines to whoever maintains the plugin.
log-context: true
context-cooldown-seconds: 10

violations:
  # How much VL every check loses per second.
  decay-per-second: 0.5

lag:
  # When packets get stuck (lag) they arrive in a burst: several moves less than burst-interval-ms apart.
  # burst-moves such moves in a row = lag spike: nobody is kicked for spike-grace-ms.
  # Checks keep running, because a timer hack produces bursts too. The speed check's budget already
  # absorbs about 1 second (+1.5x ping) of stuck movement.
  burst-moves: 3
  burst-interval-ms: 10
  spike-grace-ms: 1500
  # Movement checks pause while the server TPS is below this.
  min-tps-for-movement: 18.0
  # Movement checks pause for players with a ping above this (ms).
  max-ping-for-movement: 1000

# Login plugins (AuthMe, nLogin, LoginSecurity, LibreLogin, JPremium, FastLogin...) are found automatically.
# Cracked players are frozen until they type /login; a frozen player can hang in the air (they left while
# jumping), which looks like flying. Players are not checked at all until they have logged in.
# AuthMe, nLogin, LoginSecurity and LibreLogin are asked directly (also automatic logins of premium/Bedrock
# players). For other login plugins a player counts as logged in 3 seconds after /login, /register, /l, /reg...
login-plugins:
  enabled: true
  # Checks start anyway this long after joining (10-600), even if the login plugin never says "logged in".
  max-wait-seconds: 120
  # Login commands of your login plugin with other names (for example a translated "/entrar").
  extra-commands: []

kick:
  # Only used when ban-waves are disabled (a kick would tell a cheater that they were detected).
  enabled: true
  # Never kick players with a higher ping than this, or when the server TPS is lower than min-tps.
  max-ping: 400
  min-tps: 17.0
  # Never kick in the first seconds after joining (AuthMe login teleports etc.).
  join-grace-seconds: 10
  message: "<red>Kicked by NovaGuard: unfair advantage detected (<check>).</red>"

# Every check has:
#   enabled:    on/off
#   mode:       enforce = block the cheat (rubberband / cancel hit); silent = only log and alert.
#               Use silent to test a check on your server for a while before enforcing it.
#   kick-vl:    VL that kicks (only without ban waves). 0 = never.
#   suspect-vl: VL that silently makes a Java player a ban-wave suspect. 0 = never.
checks:
  speed:
    enabled: true
    mode: enforce
    kick-vl: 80
    suspect-vl: 20
    # Slack on top of the player's real speed (sprint-jumping, head-hitters). 1.6 = 60% extra.
    multiplier: 1.6
    ice-multiplier: 3.0
    # Ignore overshoots smaller than this (blocks).
    min-overshoot: 0.3
  fly:
    enabled: true
    mode: enforce
    kick-vl: 80
    suspect-vl: 20
    # Extra blocks allowed above the highest legit jump.
    jump-margin: 0.6
    # Being in the air this long (ms) without falling at least hover-min-drop blocks = hovering.
    hover-ms: 1000
    hover-min-drop: 0.5
  nofall:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3
    # Moves where the client lies about standing on ground before NoFall triggers.
    min-spoofs: 3
  reach:
    enabled: true
    mode: enforce
    kick-vl: 30
    suspect-vl: 8
    # Extra blocks allowed on top of the real reach + hitbox margin.
    tolerance: 0.25
    # Hits slightly beyond real reach (inside the tolerance) still land, but deal this much damage.
    # 1.0 = full damage (soft mitigation off).
    soft-damage-multiplier: 0.75
  aim:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # Maximum angle (degrees) between where the player looks and the target.
    max-angle: 70
    # Suspicious hits in a row before it counts.
    buffer: 3
  wall-hit:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    buffer: 3
  multi-target:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # More than max-targets different entities inside window-ms = killaura switching.
    max-targets: 2
    window-ms: 250
  autoclicker:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3
    # Set high on purpose: butterfly/jitter clicking is legit. Maximum 60.
    max-cps: 22
    # Seconds in a row above max-cps before it is flagged.
    seconds: 3
  block-reach:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # Extra blocks on top of the block_interaction_range attribute (4.5 in survival).
    tolerance: 0.5
  velocity:
    # Anti-knockback. Catches "0% knockback" only; it cannot block anything, so mode does not matter.
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3

monitor:
  # /monitor <player> watches a player this long, then writes a report to plugins/NovaGuard/reports/.
  duration-hours: 72
  # Without ban waves: kick a Java player once when the final report says "likely cheating".
  kick-on-likely: true
  kick-message: "<red>NovaGuard: a 3-day review found likely cheating. Staff will look at the report.</red>"

ban-waves:
  # Detected cheaters are never told. They become suspects, are watched silently (their cheats are still
  # blocked), and once the evidence is confirmed across several sessions they are banned later at a random
  # time, so they cannot tell what got them caught. Bedrock players are never banned automatically.
  enabled: true
  # Separate play sessions with strong detections needed (together with a "likely cheating" verdict).
  min-sessions: 2
  # The ban happens a random time between these after confirmation. Staff can cancel: /ng bans cancel <name>
  delay-min-hours: 24
  delay-max-hours: 72
  # How long bans last: see punishments.ban-days below (3, then 10, then 30 days).
  # Allow IP bans at all (careful: family on the same Wi-Fi is banned too). When they are proposed: see
  # punishments.ip-ban-from-ban below.
  ip-ban: true
  # Also ban other accounts that joined from the same IP addresses (see alts below).
  ban-alts: true
  # true = the cheater's own account is banned automatically, but the IP ban and the alt bans wait until an
  # admin approves them. A red alert appears in the console (repeated every 30 minutes) and admins who join
  # are told. Approve: ng approve <name>   Refuse: ng deny <name>   (waiting list: ip-approvals.yml)
  # If nobody decides before the account ban ends (duration-days), the request expires and nothing happens.
  ip-ban-approval: true
  reason: "Cheating (NovaGuard)"

punishments:
  # Every NovaGuard ban (cheating, duping, illegal items) is longer than the one before:
  # 1st ban 3 days, 2nd ban 10 days, 3rd and later 30 days. 0 = permanent.
  ban-days: [3, 10, 30]
  # From this ban on (2 = the player is banned again after an earlier ban), an admin is asked whether the IP
  # should be banned too. The red console alert says how often the player was banned before. 0 = never ask.
  ip-ban-from-ban: 2
  # Only bans of the last N days count for the ladder above (0 = forever).
  remember-bans-days: 365

alts:
  # Remember which accounts join from which IP address (stored in plugins/NovaGuard/alts.yml).
  enabled: true
  # An IP used by more accounts than this is treated as shared (school, cafe, proxy) and never linked or banned.
  max-accounts-per-ip: 5

watchdog:
  # Warn in the console when one check takes longer than this for a single event (milliseconds).
  slow-ms: 5
  # A part of NovaGuard that throws this many errors within a minute switches itself off until /ng reload.
  max-errors-per-minute: 20

notify:
  # Discord channel webhook URL (Channel settings > Integrations > Webhooks). Empty = off.
  discord-webhook: ""
  email:
    enabled: false
    # Gmail: smtp.gmail.com, port 465, your Gmail address, and an APP PASSWORD
    # (Google account > Security > 2-Step Verification > App passwords), never your real password.
    # Anyone who can read this file can read the password: use a separate Gmail account for the server.
    smtp-host: "smtp.gmail.com"
    smtp-port: 465
    username: ""
    password: ""
    from: ""
    to: ""
  # Which events are sent.
  events:
    suspect: true
    queued: true
    banned: true
    spike: true

anti-dupe:
  enabled: true
  # Trim items stacked above their maximum (e.g. 127 totems) and alert.
  fix-overstacked: true
  # Close donkey/llama/chest-boat/minecart inventories when the entity dies, teleports or is far away.
  entity-container-guard: true
  fingerprints:
    enabled: true
    # Remove the extra copy of a duplicated item right away. Exactly one copy always stays.
    undo-dupes: true
    scan-interval-seconds: 60
    # Also give a hidden ID to every unstackable enchanted item and every enchanted book (Mending books...).
    tag-enchanted-items: true
    # These unstackable items always get a hidden ID. Stackable items (diamonds...) cannot get one: all copies
    # of a stack are identical, so a duped diamond can never be told apart from a mined one.
    materials:
      - ELYTRA
      - TOTEM_OF_UNDYING
      - MACE
      - TRIDENT
      - NETHERITE_SWORD
      - NETHERITE_AXE
      - NETHERITE_PICKAXE
      - NETHERITE_SHOVEL
      - NETHERITE_HOE
      - NETHERITE_SPEAR
      - NETHERITE_HELMET
      - NETHERITE_CHESTPLATE
      - NETHERITE_LEGGINGS
      - NETHERITE_BOOTS
      - SHULKER_BOX
      - WHITE_SHULKER_BOX
      - ORANGE_SHULKER_BOX
      - MAGENTA_SHULKER_BOX
      - LIGHT_BLUE_SHULKER_BOX
      - YELLOW_SHULKER_BOX
      - LIME_SHULKER_BOX
      - PINK_SHULKER_BOX
      - GRAY_SHULKER_BOX
      - LIGHT_GRAY_SHULKER_BOX
      - CYAN_SHULKER_BOX
      - PURPLE_SHULKER_BOX
      - BLUE_SHULKER_BOX
      - BROWN_SHULKER_BOX
      - GREEN_SHULKER_BOX
      - RED_SHULKER_BOX
      - BLACK_SHULKER_BOX
  # What happens to the player after a dupe was undone. A player is only warned when the copy can only have
  # come from them (see the README: "Who gets blamed"). Unclear cases are undone without a warning.
  punish:
    enabled: true
    # silent = TEST MODE: duplicates are still removed, but nobody is warned or banned. The console and
    #          violations.log say "[test mode] would warn ... / would ban ...". Run this for about a week, read
    #          the log, and when every "would" is a real duper, switch to: enforce
    # enforce = warnings and bans as described below.
    mode: silent
    # Warnings before the ban: "Warning 1/5" ... more than max-warnings = banned at once (ban length: punishments).
    max-warnings: 5
    # Warnings closer together than this count as one (one exploit often shows up in several scans).
    warning-cooldown-seconds: 60
    # The first warning also puts the player on the suspect list for monitor.duration-hours (3 days).
    # true = a second warning during that watch bans them when the watch ends. No repeat = removed from the
    # list and their warnings are cleared.
    ban-on-repeat: true
    # After a crash (or the panel's Kill button) the world and the players are saved at different moments, which
    # copies items by itself. Copies of items older than the crash are removed, but nobody is warned for this long.
    crash-grace-hours: 72
    # If this many different players "dupe" within mass-dupe-minutes, it is a rollback or another plugin copying
    # items, not cheaters: their warnings are taken back and warnings pause for mass-dupe-pause-hours.
    mass-dupe-players: 3
    mass-dupe-minutes: 10
    mass-dupe-pause-hours: 24
    # Players with at least this many hours on the server are never banned for dupes by NovaGuard alone: the ban
    # waits for an admin (red console alert; ng bans now <name> / ng bans cancel <name>). 0 = off.
    review-above-hours: 50
    # Staff (novaguard.dupe.exempt, default: ops) KEEP copies: they get new IDs instead of being removed.
    # Creative clones and /give items are not dupes. Leaving creative mode also gives every item a new ID.
    staff-keep-copies: true
    # Grave / death-chest plugins give items back on respawn in their own way: copies that appear this soon after
    # a respawn are removed, but never warned.
    respawn-grace-seconds: 30
    # Also warn and ban Bedrock (Geyser) players for dupes. Item evidence does not depend on the client, unlike
    # movement checks. IP bans of Bedrock players are still never proposed.
    bedrock: true
    warn-message: "<red><bold>Duping detected!</bold> The duplicated item was removed. Warning <count>/<max>. More than <max> warnings = automatic ban.</red>"
    removed-message: "<yellow>A duplicate copy of an item was removed (another copy of the same item exists). This is not counted as a warning.</yellow>"
    ban-reason: "Duping / illegal items (NovaGuard)"

wealth-alerts:
  # Stackable items (diamonds...) cannot carry a hidden ID, so a duped diamond looks like a mined one. Instead
  # staff are ALERTED (never anything automatic) when a player gains a lot of value very fast. Trades, shops and
  # big mining trips also do this: spectate before acting.
  enabled: true
  window-minutes: 10
  # Value gained within the window that triggers an alert (576 = 64 diamond blocks... see values).
  threshold: 576
  # Value of one item. Items inside shulker boxes and bundles count too.
  values:
    DIAMOND: 1
    DIAMOND_BLOCK: 9
    NETHERITE_SCRAP: 4
    NETHERITE_INGOT: 16
    NETHERITE_BLOCK: 144
    ANCIENT_DEBRIS: 4
    ENCHANTED_GOLDEN_APPLE: 16
    TOTEM_OF_UNDYING: 8
    NETHER_STAR: 32
    ELYTRA: 64
    BEACON: 40
    SHULKER_SHELL: 2
    EMERALD_BLOCK: 1

illegal-items:
  # Fixes items that are impossible in survival: enchantments above their maximum level (Sharpness 10),
  # enchantments that exclude each other (Density + Breach), enchantments on items that cannot have them
  # (Knockback on a stick). The rules come from the server itself, so they always match vanilla exactly.
  # Note: Breach + Wind Burst on a mace IS legal in vanilla and is left alone.
  enabled: true
  # Unbreakable cannot be obtained in survival.
  remove-unbreakable: true
  # Remove custom attribute modifiers (e.g. +1000 attack damage). Off by default: some plugins use them.
  remove-custom-attributes: false
  # Leave items alone that carry another plugin's data (custom enchant, crate, custom item plugins).
  # Set to false if your illegal items come from a plugin you no longer want.
  skip-plugin-items: true
  # An illegal item that appears in a player's own inventory (not picked up, not from a chest) puts them on the
  # suspect list. It is never a warning or a ban by itself: it could come from a trade/auction/crate plugin.
  # A warning is only given when a checked, legal item became illegal in the player's own inventory.
  suspect: true
  fixed-message: "<yellow>An item had enchantments that are impossible in survival and was fixed: <changes></yellow>"
