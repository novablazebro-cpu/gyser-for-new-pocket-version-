# NovaGuard configuration. Use /novaguard reload after editing.
# VL = violation level. Every failed check adds VL; VL goes down by itself over time.

alerts:
  # Minimum milliseconds between two alerts for the same player and check (stops chat spam).
  cooldown-ms: 1500
  # Also print alerts in the server console.
  console: true

# Write every flag to plugins/NovaGuard/violations.log
log-to-file: true
# Also write what the player was doing (last moves, ping, effects, block below) when a check flags.
# This is how false positives are found: send these lines to whoever maintains the plugin.
log-context: true
context-cooldown-seconds: 10

violations:
  # How much VL every check loses per second.
  decay-per-second: 0.5

lag:
  # When packets get stuck (lag) they arrive in a burst: several moves less than burst-interval-ms apart.
  # burst-moves such moves in a row = lag spike: nobody is kicked for spike-grace-ms.
  # Checks keep running, because a timer hack produces bursts too. The speed check's budget already
  # absorbs about 1 second (+1.5x ping) of stuck movement.
  burst-moves: 3
  burst-interval-ms: 10
  spike-grace-ms: 1500
  # Movement checks pause while the server TPS is below this.
  min-tps-for-movement: 18.0
  # Movement checks pause for players with a ping above this (ms). -1 = never pause (default): a PingSpoof
  # cheat can fake any ping, so a ping limit would switch the checks off for cheaters. Lag is handled by
  # the burst detection and a speed budget that grows with ping (capped).
  max-ping-for-movement: -1

kick:
  # Only used when ban-waves are disabled (a kick would tell a cheater that they were detected).
  enabled: true
  # Never kick players with a higher ping than this, or when the server TPS is lower than min-tps.
  max-ping: 400
  min-tps: 17.0
  # Never kick in the first seconds after joining (AuthMe login teleports etc.).
  join-grace-seconds: 10
  message: "<red>Kicked by NovaGuard: unfair advantage detected (<check>).</red>"

# Every check has:
#   enabled:    on/off
#   mode:       enforce = block the cheat (rubberband / cancel hit); silent = only log and alert.
#               Use silent to test a check on your server for a while before enforcing it.
#   kick-vl:    VL that kicks (only without ban waves). 0 = never.
#   suspect-vl: VL that silently makes a Java player a ban-wave suspect. 0 = never.
checks:
  speed:
    enabled: true
    mode: enforce
    kick-vl: 80
    suspect-vl: 20
    # Slack on top of the player's real speed (sprint-jumping, head-hitters). 1.6 = 60% extra.
    multiplier: 1.6
    ice-multiplier: 3.0
    # Ignore overshoots smaller than this (blocks).
    min-overshoot: 0.3
  fly:
    enabled: true
    mode: enforce
    kick-vl: 80
    suspect-vl: 20
    # Extra blocks allowed above the highest legit jump.
    jump-margin: 0.6
    # Being in the air this long (ms) without falling at least hover-min-drop blocks = hovering.
    hover-ms: 1000
    hover-min-drop: 0.5
  nofall:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3
    # Moves where the client lies about standing on ground before NoFall triggers. 1 = any lie that saved
    # fall damage (NoFall cheats often lie only once per fall). Clients that never claim ground at all
    # ("NoGround") are caught separately when they land.
    min-spoofs: 1
  reach:
    enabled: true
    mode: enforce
    kick-vl: 30
    suspect-vl: 8
    # Extra blocks allowed on top of the real reach + hitbox margin.
    tolerance: 0.25
    # Hits slightly beyond real reach (inside the tolerance) still land, but deal this much damage.
    # 1.0 = full damage (soft mitigation off).
    soft-damage-multiplier: 0.75
  aim:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # Maximum angle (degrees) between where the player looks and the target.
    max-angle: 70
    # Suspicious hits in a row before it counts.
    buffer: 3
  wall-hit:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    buffer: 3
  multi-target:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # More than max-targets different entities inside window-ms = killaura switching.
    max-targets: 2
    window-ms: 250
  autoclicker:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3
    # Set high on purpose: butterfly/jitter clicking is legit. Maximum 60.
    max-cps: 22
    # Seconds in a row above max-cps before it is flagged.
    seconds: 3
  block-reach:
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # Extra blocks on top of the block_interaction_range attribute (4.5 in survival).
    tolerance: 0.5
  velocity:
    # Anti-knockback. Catches "0% knockback" only; it cannot block anything, so mode does not matter.
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 3
  fast-break:
    # Nuker: breaking far more blocks per second than any player can. Minecraft itself already refuses
    # hard blocks broken too fast; nukers clear dozens of soft blocks (grass, crops) per tick. Every click
    # can break one instant-break block, so fast drag-clicking reaches 30-40/s: the limit stays above that.
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    max-per-second: 45
    seconds: 3
  fast-place:
    # Extreme FastPlace / Tower: several blocks per tick. The right-click delay only applies while the button
    # is held; every separate click places a block, so drag-clicking builders reach 30-40/s legitimately.
    # A FastPlace cheat at one block per tick (20/s) looks exactly like fast clicking and is not flagged;
    # the Scaffold check below catches scaffold cheats by where they click instead.
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    max-per-second: 45
    seconds: 3
  scaffold:
    # Scaffold: placing a block against a face that points away from the player (impossible to click).
    enabled: true
    mode: enforce
    kick-vl: 0
    suspect-vl: 5
    # Impossible placements in a row before it counts.
    buffer: 2

monitor:
  # /monitor <player> watches a player this long, then writes a report to plugins/NovaGuard/reports/.
  duration-hours: 72
  # Without ban waves: kick a Java player once when the final report says "likely cheating".
  kick-on-likely: true
  kick-message: "<red>NovaGuard: a 3-day review found likely cheating. Staff will look at the report.</red>"

ban-waves:
  # Detected cheaters are never told. They become suspects, are watched silently (their cheats are still
  # blocked), and once the evidence is confirmed across several sessions they are banned later at a random
  # time, so they cannot tell what got them caught. Bedrock players are never banned automatically.
  enabled: true
  # Separate play sessions with strong detections needed (together with a "likely cheating" verdict).
  min-sessions: 2
  # The ban happens a random time between these after confirmation. Staff can cancel: /ng bans cancel <name>
  delay-min-hours: 24
  delay-max-hours: 72
  duration-days: 30
  # Also ban the IP addresses the cheater used (careful: family on the same Wi-Fi is banned too).
  ip-ban: true
  # Also ban other accounts that joined from the same IP addresses (see alts below).
  ban-alts: true
  # true = the cheater's own account is banned automatically, but the IP ban and the alt bans wait until an
  # admin approves them. A red alert appears in the console (repeated every 30 minutes) and admins who join
  # are told. Approve: ng approve <name>   Refuse: ng deny <name>   (waiting list: ip-approvals.yml)
  # If nobody decides before the account ban ends (duration-days), the request expires and nothing happens.
  ip-ban-approval: true
  reason: "Cheating (NovaGuard)"

alts:
  # Remember which accounts join from which IP address (stored in plugins/NovaGuard/alts.yml).
  enabled: true
  # An IP used by more accounts than this is treated as shared (school, cafe, proxy) and never linked or banned.
  max-accounts-per-ip: 5
  # Only link an account to its IP after it stayed online this long, so it has logged in (AuthMe). Joining
  # with someone else's name without the password then links nothing.
  record-after-seconds: 120

watchdog:
  # Warn in the console when one check takes longer than this for a single event (milliseconds).
  slow-ms: 5
  # A part of NovaGuard that throws this many errors within a minute switches itself off until /ng reload.
  max-errors-per-minute: 20

notify:
  # Discord channel webhook URL (Channel settings > Integrations > Webhooks). Empty = off.
  discord-webhook: ""
  email:
    enabled: false
    # Gmail: smtp.gmail.com, port 465, your Gmail address, and an APP PASSWORD
    # (Google account > Security > 2-Step Verification > App passwords), never your real password.
    # Anyone who can read this file can read the password: use a separate Gmail account for the server.
    smtp-host: "smtp.gmail.com"
    smtp-port: 465
    username: ""
    password: ""
    from: ""
    to: ""
  # Which events are sent.
  events:
    suspect: true
    queued: true
    banned: true
    spike: true

anti-dupe:
  enabled: true
  # Trim items stacked above their maximum (e.g. 127 totems) and alert.
  fix-overstacked: true
  # Close donkey/llama/chest-boat/minecart inventories when the entity dies, teleports or is far away.
  entity-container-guard: true
  # Block clicks in a chest/barrel/shulker window whose block was broken, moved or is far away (the
  # "break the chest while it is open" dupes). Plugin menus are never affected.
  block-container-guard: true
  fingerprints:
    enabled: true
    # Undupe: delete the extra copies of a duplicated item. Innocent players keep their item:
    #  - one player holds several copies (also inside shulkers/bundles): one copy is kept, the rest deleted;
    #  - two players hold it and one RECEIVED it normally (picked it up or took it out of a chest): that
    #    player keeps it, and the one who gave it away but still has it loses the copy (the duper);
    #  - two players hold it and nobody knows who received it: nobody loses their only copy, staff alerted.
    remove-duplicates: true
    scan-interval-seconds: 60
    # Only unstackable items from this list get a hidden ID.
    materials:
      - ELYTRA
      - TOTEM_OF_UNDYING
      - MACE
      - TRIDENT
      - NETHERITE_SWORD
      - NETHERITE_AXE
      - NETHERITE_PICKAXE
      - NETHERITE_SHOVEL
      - NETHERITE_HOE
      - NETHERITE_SPEAR
      - NETHERITE_HELMET
      - NETHERITE_CHESTPLATE
      - NETHERITE_LEGGINGS
      - NETHERITE_BOOTS
      - SHULKER_BOX
      - WHITE_SHULKER_BOX
      - ORANGE_SHULKER_BOX
      - MAGENTA_SHULKER_BOX
      - LIGHT_BLUE_SHULKER_BOX
      - YELLOW_SHULKER_BOX
      - LIME_SHULKER_BOX
      - PINK_SHULKER_BOX
      - GRAY_SHULKER_BOX
      - LIGHT_GRAY_SHULKER_BOX
      - CYAN_SHULKER_BOX
      - PURPLE_SHULKER_BOX
      - BLUE_SHULKER_BOX
      - BROWN_SHULKER_BOX
      - GREEN_SHULKER_BOX
      - RED_SHULKER_BOX
      - BLACK_SHULKER_BOX

chunk-guard:
  # Against chunk overloading (lag machines and "chunk bans"): thousands of dropped items, XP orbs, arrows,
  # snowballs or falling blocks packed into one chunk. Above the limit the extra ones are removed when the
  # chunk loads and every scan-interval-seconds. Mobs, item frames, armour stands, minecarts, boats, ender
  # pearls and thrown tridents are never removed. Normal farms stay far below 1000.
  enabled: true
  max-loose-entities: 1000
  scan-interval-seconds: 15

illegal-enchantments:
  # Find and fix enchantments that are impossible in survival. NovaGuard asks Minecraft itself what is legal
  # (maximum level, which items an enchantment may go on, which enchantments conflict), so this also works
  # for new items and datapack enchantments without a list to keep up to date.
  # Checked: on join, when a chest/barrel/shulker is opened or closed, on pickup, when switching hotbar slot,
  # when hitting (the hit is cancelled) or being hit (armour), and every scan-interval-seconds.
  # Items inside shulker boxes and bundles are fixed too. Fixes are alerted and written to violations.log.
  # Staff who hand out special items can be given novaguard.enchant.bypass.
  enabled: true
  # Too high a level, e.g. Sharpness 6 or Sharpness 10 (maximum 5):
  #   remove = take the enchantment off completely
  #   cap    = lower it to the maximum (Sharpness 10 -> Sharpness 5)
  #   allow  = do not check levels
  over-level: remove
  # Remove enchantments that cannot be on the item at all (Sharpness on a pickaxe, Protection on a sword).
  wrong-item: true
  # Remove the weaker of two enchantments that cannot be together (Sharpness + Smite, Mending + Infinity,
  # Silk Touch + Fortune, Protection + Blast Protection...). On equal levels the choice is always the same.
  conflicts: true
  scan-interval-seconds: 30
  # Raise the maximum for single enchantments if your server gives out stronger items on purpose.
  # Example:
  #   max-levels:
  #     sharpness: 7
  #     efficiency: 10
  max-levels: {}
