name: NovaGuard
version: '${version}'
main: io.github.novablaze.novaguard.NovaGuardPlugin
api-version: '26.3'
description: Lightweight, lag-safe anti-cheat and anti-dupe for Paper 26.3.
authors: [Nova]
softdepend: [floodgate, Geyser-Spigot, AuthMe, nLogin, LoginSecurity, OpeNLogin, LibreLogin, JPremium, FastLogin]
permissions:
  novaguard.admin:
    description: Every staff command (/novaguard ..., /monitor ...), red ban/IP alerts, and alerts.
    default: op
    children:
      novaguard.alerts: true
  novaguard.alerts:
    description: Receive cheat, dupe and wealth alerts, and use /novaguard alerts to turn them off/on.
    default: op
  novaguard.dupe.exempt:
    description: Never warned or banned for dupes / illegal items (duplicates are still removed).
    default: op
  novaguard.bypass:
    description: Skips every anti-cheat check (anti-dupe still applies).
    default: false
